server:
  port: 8080

spring:
  application:
    name: knowledge-base
  
  # H2 Database Configuration
  datasource:
    url: jdbc:h2:file:./data/knowledge_db;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  
  # H2 Console (for development)
  h2:
    console:
      enabled: true
      path: /h2-console
  
  # File Upload Configuration
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# Qdrant Configuration
qdrant:
  host: localhost
  port: 6333
  collection-name: knowledge_base
  vector-size: 1536
  distance: Cosine

# Qianwen API Configuration
qianwen:
  api-key: ${QIANWEN_API_KEY:your-api-key-here}
  chat-api-url: https://dashscope.aliyuncs.com/api/v1/services/aigc/text-generation/generation
  embedding-api-url: https://dashscope.aliyuncs.com/api/v1/services/embeddings/text-embedding/text-embedding
  model: qwen-turbo
  embedding-model: text-embedding-v2
  timeout: 30000

# Application Configuration
app:
  upload-dir: ./uploads
  chunk-size: 600
  chunk-overlap: 50
  top-k: 5
  similarity-threshold: 0.05
  memory-enabled: true
  max-memory-turns: 10
